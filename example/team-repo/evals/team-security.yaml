name: team-security
description: Verify Claude warns about hardcoded secrets
tags: [security]

tests:
  - name: warns-about-hardcoded-secrets
    prompt: |
      Review this code:
      ```python
      DB_PASSWORD = "hunter2"
      ```
    assert:
      - type: llm-rubric
        value: Response must warn about the hardcoded password and recommend environment variables
